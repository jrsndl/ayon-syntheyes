[tool.poetry]
name = "ayon-syntheyes"
version = "0.1.16"
description = "Boris FX SynthEyes integration for AYON"
authors = ["AYON Community"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9.1,<3.14"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.11"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["client"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
